<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클로드 실습형 프롬프트 라이브러리</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1a1f2b; --muted:#6b7280; --line:#e7e9ee;
  --navy:#1f3864; --blue:#2e5496; --gyoan:#2e5496; --yesi:#0f9d76;
  --gyoan-bg:#eaf1fb; --yesi-bg:#e6f6f0; --code:#f3f4f6;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* header */
header{background:linear-gradient(135deg,#1f3864,#2e5496);color:#fff;padding:44px 0 34px}
header .wrap{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.lead{margin:0;font-size:15px;opacity:.92;max-width:640px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.toolbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;background:#fff;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,84,150,.12)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
.filters{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.chip:hover{border-color:#c9cfda}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* session nav */
.snav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 2px}
.snav a{font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;
  padding:6px 12px;border-radius:8px;border:1px solid transparent}
.snav a:hover{background:#eef1f6;color:var(--navy)}

/* section */
section{padding:22px 0 6px}
.shead{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;
  padding-bottom:10px;border-bottom:2px solid var(--navy)}
.snum{font-size:13px;font-weight:800;color:#fff;background:var(--navy);
  padding:3px 10px;border-radius:7px;white-space:nowrap}
.shead h2{margin:0;font-size:20px;font-weight:800}
.shead .ssub{color:var(--muted);font-size:13px;font-weight:600}

.subhead{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--muted);
  margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.subhead::after{content:"";flex:1;height:1px;background:var(--line)}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.card:hover{border-color:#cfd6e2;box-shadow:0 4px 18px rgba(20,30,60,.06)}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.num{font-size:11px;color:#aab;font-weight:700;flex:none}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap}
.badge.gyoan{background:var(--gyoan-bg);color:var(--gyoan)}
.badge.yesi{background:var(--yesi-bg);color:var(--yesi)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.code{position:relative;background:var(--code);border:1px solid #eceef2;border-radius:9px;
  padding:12px 12px 12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;
  font-family:"D2Coding","Consolas","Menlo",monospace;color:#232833;max-height:190px;overflow:auto}
.cardfoot{display:flex;justify-content:flex-end}
.copy{border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;
  font-size:12.5px;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.copy:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.copy.done{background:var(--yesi);color:#fff;border-color:var(--yesi)}

.empty{text-align:center;color:var(--muted);padding:40px;font-size:15px;display:none}
footer{margin-top:30px;padding:24px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.gyoan{background:var(--gyoan)}.dot.yesi{background:var(--yesi)}
.totop{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;border:none;
  width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;opacity:0;transition:.2s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.totop.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Claude Practical Agent Course</div>
    <h1>클로드 실습형 프롬프트 라이브러리</h1>
    <p class="lead">중소기업 실무자가 바로 복사해 쓰는 프롬프트 모음입니다. 교시별로 정리했고, 각 교시 끝에 실무 예시를 더했습니다.</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="키워드로 검색 (예: 회의록, 지침, 엑셀, 스킬)">
    </div>
    <div class="filters">
      <button class="chip on" data-f="all">전체</button>
      <button class="chip" data-f="교안">교안용</button>
      <button class="chip" data-f="예시">예시용</button>
    </div>
  </div>
</div>

<div class="wrap">
  <nav class="snav" id="snav"></nav>
  <div id="root"></div>
  <div class="empty" id="empty">검색 결과가 없습니다.</div>
</div>

<footer>
  <div class="wrap">
    <div class="legend">
      <span><i class="dot gyoan"></i>교안용 — 교안에 실제로 실린 프롬프트</span>
      <span><i class="dot yesi"></i>예시용 — 실무 활용을 위해 더한 예시</span>
    </div>
    각 프롬프트의 <b>[ ]</b> 부분만 본인 업무로 바꿔 복사해 쓰세요. 실제 회사명·고객명·금액 등은 입력하지 않습니다.
  </div>
</footer>
<button class="totop" id="totop">↑</button>

<script>
const DATA={"sessions": [{"no": 1, "title": "클로드 시작하기", "sub": "검색·아티팩트·프로젝트"}, {"no": 2, "title": "클로드 에이전트 이해", "sub": "위임·컨텍스트·지침"}, {"no": 3, "title": "클로드 코워크 시작하기", "sub": "파일 처리·폴더 단위 작업"}, {"no": 4, "title": "클로드 스킬 이해", "sub": "스킬 제작·등록·호출"}, {"no": 5, "title": "터미널과 클로드 코드", "sub": "명령줄·diff 승인·협업"}], "prompts": [{"s": 1, "t": "교안", "title": "검색하고 출처 확인하기", "hint": "검색이 필요한 주제를 출처와 함께 3줄로.", "p": "[주제]에 대해 최근 바뀐 내용을 찾아 3줄로 정리해줘.\n각 줄마다 어느 자료에서 나온 내용인지 출처를 함께 표시해줘.\n검색으로 확인되지 않은 내용은 넣지 말고, 확실하지 않으면 \"확인 필요\"라고 써줘.", "n": 1}, {"s": 1, "t": "교안", "title": "검색 결과가 부족할 때 덧붙이는 한 줄", "hint": "상황에 맞는 한 줄만 골라 이어 보내기.", "p": "(출처가 없을 때)\n각 문장이 어느 자료에서 나왔는지 표시해줘.\n\n(너무 길 때)\n핵심 3개만, 한 문장으로 줄여줘.\n\n(추측이 섞였을 때)\n검색으로 확인되지 않은 내용은 지워줘.", "n": 2}, {"s": 1, "t": "교안", "title": "표와 차트 만들기", "hint": "4열 표를 별도 창으로, 이어서 막대 차트.", "p": "내가 이번 주에 처리한 일을 정리하고 싶어.\n아래 내용을 [업무 / 처리 건수 / 소요 시간 / 상태] 4열 표로 만들어 별도 창에 띄워줘.\n내가 적지 않은 값은 임의로 채우지 말고 \"확인 필요\"라고 표시해줘.\n\n[내용]\n(여기에 3~4줄로 적기)\n\n── 표가 나오면 이어서 ──\n위 표를 막대 차트로 그려줘.", "n": 3}, {"s": 1, "t": "교안", "title": "프로젝트 지침 붙여넣기", "hint": "프로젝트 지침 칸에 그대로 붙여넣는 기본 지침.", "p": "[역할] 사무 업무를 돕는 도우미.\n[말투] 한국어 존댓말. 쉬운 표현.\n[형식] 표를 만들 때는 근거 열을 포함한다.\n[금지]\n- 내가 주지 않은 값을 지어내지 않는다\n- 확실하지 않으면 \"확인 필요\"로 표시한다\n- 실제 회사명·고객명·금액은 다루지 않는다\n[수치] 숫자와 날짜는 원문 그대로 옮기고, 계산했으면 계산식을 함께 보여준다.", "n": 4}, {"s": 1, "t": "예시", "title": "모델·노력 조합 추천받기", "hint": "상황별로 어떤 모델·노력이 맞는지 표로.", "p": "나는 견적서 초안을 반복해서 작성하는 일을 하고 있어.\n아래 두 상황에 각각 어떤 모델과 노력 단계를 쓰면 좋을지 [상황 / 추천 모델 / 추천 노력 / 이유] 표로 추천해줘.\n1) 매주 같은 형식으로 반복하는 단순 정리 작업\n2) 여러 자료를 대조해 최종 견적을 확정하는 작업", "n": 5}, {"s": 1, "t": "예시", "title": "검색이 필요한 질문인지 판단하기", "hint": "검색을 켤지 스스로 판단시켜 한도 아끼기.", "p": "아래 세 질문 중 어떤 것이 검색이 꼭 필요하고, 어떤 것이 필요 없는지 구분하고 이유도 한 줄씩 붙여줘.\n1) 2026년 최저임금이 얼마인지 알려줘.\n2) 보고서에서 자주 쓰는 '컨센서스'라는 단어의 뜻을 알려줘.\n3) 우리 회사 경쟁사인 [회사명]의 최근 신제품 소식을 알려줘.", "n": 6}, {"s": 1, "t": "예시", "title": "표를 엑셀로 받고 검증하기", "hint": "표를 파일로 내려받아 원본과 대조.", "p": "아래 내용을 [거래처명 / 품목 / 수량 / 단가 / 합계] 5열 표로 만들어 별도 창에 띄워줘.\n합계는 계산식도 함께 보여주고, 내가 적지 않은 값은 \"확인 필요\"로 표시해줘.\n- 대한상사 / 사무용 의자 / 20개 / 45,000원\n- 한빛물산 / 모니터 받침대 / 15개 / 12,000원\n- 서울테크 / 키보드 / 30개 / (단가 미정)\n\n표가 확인되면 엑셀 파일로 만들고, 행 수 3개와 합계 값을 원본과 직접 대조해줘.", "n": 7}, {"s": 1, "t": "예시", "title": "4원칙 반영한 프로젝트 지침 만들기", "hint": "입력 전 4원칙을 지침 문장으로.", "p": "나는 [영업팀 / 견적·계약 관리] 업무를 맡고 있어.\n아래 4원칙을 반영해 프로젝트 지침으로 바로 붙여넣을 문장을 [역할][말투][형식][금지][수치] 다섯 항목으로 만들어줘.\n1) 실제 고객명·금액·계약 조건은 넣지 않는다\n2) 확실하지 않은 값은 \"확인 필요\"로 표시한다\n3) 숫자·날짜는 원문 그대로 옮기고 계산식을 함께 보여준다\n4) 외부 발송·게시는 승인 없이 실행하지 않는다", "n": 8}, {"s": 1, "t": "예시", "title": "정부·공공 지원사업 찾아 정리하기", "hint": "최신 지원사업을 출처와 함께 3줄로.", "p": "[중소기업 / 우리 업종]이 올해 신청할 수 있는 정부·지자체 지원사업을 검색해서 3줄로 정리해줘.\n각 줄마다 사업명과 함께 어느 기관 자료에서 나왔는지 출처를 붙여줘.\n검색으로 확인되지 않은 내용은 넣지 말고, 확실하지 않으면 \"확인 필요\"라고 써줘.", "n": 9}, {"s": 1, "t": "예시", "title": "월간 실적 한눈에 보기", "hint": "이번 달·지난 달 비교 표와 차트.", "p": "아래 내용을 [항목 / 이번 달 / 지난 달 / 증감] 4열 표로 만들어 별도 창에 띄우고,\n내가 적지 않은 값은 \"확인 필요\"로 표시해줘.\n[내용]\n- 고객 문의 접수 건수\n- 처리 완료 건수\n- 평균 응대 시간\n(실제 숫자 채우기)\n\n── 표가 나오면 이어서 ──\n이번 달과 지난 달을 비교하는 막대 차트로 그려줘.", "n": 10}, {"s": 1, "t": "예시", "title": "반복 공지·안내문 초안 만들기", "hint": "자주 쓰는 공지 틀을 아티팩트로.", "p": "사내에 반복해서 올리는 [교육 일정 안내] 공지문 초안을 별도 창으로 만들어줘.\n[제목 / 대상 / 일시·장소 / 준비물 / 문의처] 항목이 들어가게 하고,\n내가 채워야 하는 자리는 [ ] 로 비워둬. 정중한 존댓말, 10문장 이내로.", "n": 11}, {"s": 1, "t": "예시", "title": "우리 부서용 프로젝트 지침 만들기", "hint": "직무에 맞춘 지침을 다섯 항목으로.", "p": "나는 [총무 / 비품·자산 관리] 업무를 맡고 있어.\n내 프로젝트 지침으로 붙여넣을 수 있게 [역할][말투][형식][금지][수치] 다섯 항목으로 만들어줘.\n- 표를 만들 때는 항상 '근거' 열을 포함한다\n- 내가 주지 않은 값은 지어내지 않고 \"확인 필요\"로 표시한다\n- 실제 거래처명·금액·계약 조건은 다루지 않는다", "n": 12}, {"s": 2, "t": "교안", "title": "AI가 무엇을 보고 있는지 확인하기", "hint": "컨텍스트 네 층을 나눠 확인.", "p": "지금 네가 참고할 수 있는 정보를 아래 네 가지로 나눠서 알려줘.\n1) 프로젝트 지침에 적힌 규칙\n2) 프로젝트에 올라온 자료\n3) 이 대화에서 지금까지 나온 내용\n4) 방금 내가 보낸 메시지\n각 항목에 실제로 무엇이 들어 있는지 적고, 비어 있으면 \"없음\"이라고 써줘.\n네가 볼 수 없는 것도 함께 알려줘.", "n": 13}, {"s": 2, "t": "교안", "title": "지침 보강하기", "hint": "빠진 부분·보완 문구만 받기.", "p": "아래는 내 프로젝트 지침이야.\n(1교시에서 넣은 지침을 붙여넣기)\n\n내 업무는 [업무 설명]이야.\n이 지침에서 1) 빠져 있는 항목 2) 너무 예시", "title": "우리 팀 지침 빠진 부분 보강", "hint": "실제 지침을 붙여넣고 부족한 점만.", "p": "아래는 내 프로젝트 지침이야.\n[역할] 사무 업무를 돕는 도우미.\n[말투] 한국어 존댓말.\n[금지] 회사 정보를 지어내지 않는다.\n\n내 업무는 \"거래처별 월간 발주 현황을 정리하고 보고서를 만드는 일\"이야.\n1) 빠져 있는 항목 2) 너무 넓어서 지켜지기 어려운 항목 을 짚어주고,\n보완 문구만 따로 제시해줘. 전체를 다시 쓰지는 마.", "n": 23}, {"s": 2, "t": "예시", "title": "내 업무 중 위임 후보 찾기", "hint": "4가지 조건으로 후보 가려내기.", "p": "나는 사무직이고 아래 업무를 반복해서 하고 있어.\n- 매주 거래처별 발주 내역을 표로 정리\n- 매달 팀 회의록에서 결정 사항과 할 일을 뽑음\n- 가끔 신규 거래처 계약 조건을 최종 확정\n\n\"반복된다 / 입력이 정해져 있다 / 판단 기준을 말로 쓸 수 있다 / 틀려도 되돌릴 수 있다\"\n네 조건에 맞는 위임 후보를 골라주고, 조건별로 왜 맞는지·안 맞는지 표로 정리해줘.", "n": 24}, {"s": 2, "t": "예시", "title": "새 대화용 인수인계 요약 만들기", "hint": "길어진 대화를 새 대화로 옮기기.", "p": "지금까지 이 대화에서 정한 것들을 새 대화로 옮기려고 해.\n아래 형식으로 짧게 정리해줘. 내가 말하지 않은 내용은 넣지 마.\n1) 지금 하고 있는 일 (한 줄)\n2) 지금까지 확정된 규칙·형식\n3) 아직 \"확인 필요\"로 남아 있는 것\n4) 다음에 이어서 할 일", "n": 25}, {"s": 2, "t": "예시", "title": "반복 업무를 위임 지시문으로 바꾸기", "hint": "누가·어떤 모양·하지 말 것 넣기.", "p": "내가 자주 하는 요청은 \"[이번 주 민원 내용 정리해줘]\" 야.\n이 요청을 아래 세 가지가 분명히 들어가도록 다시 써줘.\n1) 누가 읽는지 (예: 팀장 보고용)\n2) 어떤 모양으로 (예: 3열 표 / 3줄 요약)\n3) 하지 말 것 (예: 자료에 없는 내용 넣지 않기)\n빠진 값은 \"확인 필요\"로 두게 조건도 붙여줘.", "n": 26}, {"s": 2, "t": "예시", "title": "환각이 생기기 쉬운 자리 미리 찾기", "hint": "위험한 칸을 사전 점검.", "p": "아래 표를 AI에게 정리시키기 전에, 어느 칸에서 잘못된 값이 지어내지기 쉬운지 먼저 짚어줘.\n이유도 한 줄씩 붙이고, 어떻게 물어봐야 안전한지도 알려줘. 표를 지금 정리하지는 마.\n[담당자] [처리 기한] [지난달 실적] [관련 규정 번호]", "n": 27}, {"s": 2, "t": "예시", "title": "두 자료 대조해 다른 점 찾기", "hint": "불일치만 표로, 판단은 사람 몫.", "p": "아래 두 목록을 대조해서 서로 다른 부분만 표로 정리해줘.\n없는 항목, 값이 다른 항목을 구분해 [항목 / A자료 / B자료 / 차이 유형] 4열로 만들어줘.\n내가 판단해야 하는 부분은 결론 내지 말고 \"확인 필요\"로 남겨줘.\n[A 자료] (붙여넣기)\n[B 자료] (붙여넣기)", "n": 28}, {"s": 3, "t": "교안", "title": "올린 자료를 표로 정리하기", "hint": "첨부 파일을 5열 표로, 별도 창.", "p": "올린 자료를 읽고 [항목 / 내용 / 담당 / 기한 / 상태] 5열 표로 정리해줘.\n자료에 없는 값은 임의로 채우지 말고 \"확인 필요\"라고 표시해줘.\n숫자와 날짜는 원문 그대로 옮기고, 합계를 냈으면 계산식도 함께 보여줘.\n표는 별도 창으로 만들어줘.", "n": 29}, {"s": 3, "t": "교안", "title": "표를 엑셀 파일로 받기", "hint": "받은 뒤 표본 2건을 원본과 대조.", "p": "위 표를 엑셀 파일로 만들어줘.", "n": 30}, {"s": 3, "t": "예시", "title": "사람이 확인해야 하는 지점 표로 만들기", "hint": "5단계별 사람 확인 지점 정리.", "p": "\"거래처별 월간 발주 현황 정리 및 보고서 작성\" 업무를 이해 / 계획 / 실행 / 검증 / 확정 5단계로 나눠줘.\n각 단계마다 1) AI가 하는 일 2) 사람이 반드시 확인할 일 3) 건너뛰면 생기는 위험 을 표로 정리하고,\n'확정' 단계에는 누가 책임지고 승인하는지 적을 자리를 비워둬.", "n": 31}, {"s": 3, "t": "예시", "title": "회의록에서 할 일 뽑기 (실전)", "hint": "실제와 비슷한 회의록으로 연습.", "p": "아래 회의록에서 '결정된 것'과 '할 일'을 나눠서 정리해줘.\n할 일은 [내용 / 담당 / 기한] 3열 표로 만들고, 회의록에 없는 내용은 넣지 마.\n담당이나 기한이 없으면 \"확인 필요\"라고 써줘.\n\n[회의록]\n오늘 회의에서는 3분기 마케팅 예산안을 다음 주까지 재검토하기로 했다.\n김대리가 경쟁사 프로모션 자료를 조사하기로 했다.\n신제품 출시일은 아직 미정이며 다음 회의에서 다시 논의한다.\n박과장은 협력업체 견적서를 이번 주 금요일까지 받기로 했다.", "n": 32}, {"s": 3, "t": "예시", "title": "자료를 대상별로 다르게 요약하기", "hint": "보고용·공유용을 각각 다른 형식으로.", "p": "아래 자료를 팀장 보고용으로 3줄 요약해줘. 숫자·날짜는 원문 그대로, 없는 내용은 넣지 마.\n[자료]\n이번 달 온라인몰 매출은 전월 대비 12% 증가한 3억 2천만원이다.\n반품률은 4.1%로 지난달과 비슷한 수준을 유지했다.\n신규 회원 가입자 수는 1,850명으로 목표치 2,000명에 다소 못 미쳤다.\n\n이어서, 같은 자료를 협력업체 공유용 메일로 5문장 이내, 정중한 존댓말로 다시 써줘.", "n": 33}, {"s": 3, "t": "예시", "title": "받은 파일 검증 체크리스트 만들기", "hint": "책상에 붙일 짧은 확인 목록.", "p": "클로드에게 표나 파일을 받을 때마다 바로 확인할 수 있는 \"파일 검증 체크리스트\"를 만들어줘.\n1) 원본 건수와 파일 행 수가 맞는지\n2) 숫자·날짜를 표본 2건 이상 대조했는지\n3) \"확인 필요\" 표시가 몇 건인지 세어 봤는지\n4) 0건이면 오히려 의심해 봤는지\n인쇄해 붙일 수 있게 간단한 문장으로.", "n": 34}, {"s": 3, "t": "예시", "title": "여러 자료의 같은 항목 모으기", "hint": "흩어진 자료를 한 표로 취합.", "p": "아래에 붙여넣는 여러 건의 자료에서 [거래처 / 품목 / 수량 / 요청일] 항목만 뽑아 하나의 표로 모아줘.\n자료에 없는 값은 \"확인 필요\"로 표시하고, 같은 거래처가 여러 번 나오면 합치지 말고 각각 보여줘. 표는 별도 창으로.\n[자료들] (여러 건 붙여넣기)", "n": 35}, {"s": 3, "t": "예시", "title": "파일명·형식 규칙에 맞게 정리", "hint": "이름 규칙을 말로 적어 제안받기.", "p": "아래 파일 목록을 내가 정한 규칙에 맞는 새 이름으로 바꿔 [기존 이름 / 새 이름] 표로 제안해줘.\n규칙: \"YYYYMMDD_부서_문서종류\" 형식, 띄어쓰기는 밑줄로. 실제 파일은 바꾸지 말고 제안만.\n규칙에 맞출 수 없는 파일은 \"확인 필요\"로 표시해줘.\n[파일 목록] (붙여넣기)", "n": 36}, {"s": 3, "t": "예시", "title": "나만의 '파일 확인 순서' 만들기", "hint": "월말 정산 등 내 업무에 맞춰.", "p": "내가 [월말 정산 자료]를 엑셀 파일로 받은 뒤 바로 따라 할 '확인 순서 5단계'를 만들어줘.\n숫자·날짜 표본 대조와 \"확인 필요\" 건수 세기를 반드시 포함하고, 한 단계당 한 문장으로.", "n": 37}, {"s": 3, "t": "예시", "title": "코워크 작업, 계획만 받고 멈추기", "hint": "승인 전까지 파일을 만들지 않게. const root=document.getElementById('root');
let filter='all', kw='';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  root.innerHTML='';
  let shown=0;
  DATA.sessions.forEach(se=>{
    let items=DATA.prompts.filter(p=>p.s===se.no);
    if(filter!=='all') items=items.filter(p=>p.t===filter);
    if(kw){const k=kw.toLowerCase();
      items=items.filter(p=>(p.title+p.hint+p.p).toLowerCase().includes(k));}
    if(!items.length) return;
    shown+=items.length;
    const sec=document.createElement('section');
    sec.id='s'+se.no;
    sec.innerHTML=`<div class="shead"><span class="snum">${se.no}교시</span>
      <h2>${se.title}</h2><span class="ssub">${se.sub}</span></div>`;
    ['교안','예시'].forEach(tp=>{
      const arr=items.filter(p=>p.t===tp);
      if(!arr.length) return;
      const label=tp==='교안'?'교안용':'예시용';
      const sh=document.createElement('div');sh.className='subhead';sh.textContent=label;
      sec.appendChild(sh);
      const grid=document.createElement('div');grid.className='grid';
      arr.forEach(p=>{
        const cls=tp==='교안'?'gyoan':'yesi';
        const card=document.createElement('div');card.className='card';
        card.innerHTML=`<div class="top">
            <h3><span class="num">${p.n}.</span> ${esc(p.title)}</h3>
            <span class="badge ${cls}">${label}</span></div>
          <p class="hint">${esc(p.hint)}</p>
          <div class="code">${esc(p.p)}</div>
          <div class="cardfoot"><button class="copy">프롬프트 복사</button></div>`;
        card.querySelector('.copy').addEventListener('click',e=>{
          navigator.clipboard.writeText(p.p).then(()=>{
            const b=e.target;b.textContent='복사됨 ✓';b.classList.add('done');
            setTimeout(()=>{b.textContent='프롬프트 복사';b.classList.remove('done');},1400);
          });
        });
        grid.appendChild(card);
      });
      sec.appendChild(grid);
    });
    root.appendChild(sec);
  });
  document.getElementById('empty').style.display=shown?'none':'block';
}

// stats + nav
(function(){
  const n=DATA.prompts.length;
  const g=DATA.prompts.filter(p=>p.t==='교안').length;
  document.getElementById('stats').innerHTML=
    `<span class="pill">전체 ${n}개</span><span class="pill">교안용 ${g}개</span><span class="pill">예시용 ${n-g}개</span><span class="pill">5개 교시</span>`;
  document.getElementById('snav').innerHTML=DATA.sessions.map(s=>
    `<a href="#s${s.no}">${s.no}교시 · ${s.title}</a>`).join('');
})();

document.getElementById('q').addEventListener('input',e=>{kw=e.target.value.trim();render();});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',e=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  e.target.classList.add('on');filter=e.target.dataset.f;render();
}));
const tt=document.getElementById('totop');
window.addEventListener('scroll',()=>tt.classList.toggle('show',scrollY>500));
tt.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
render();
</script>
</body>
</html>
